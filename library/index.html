<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MotionC Library</title>
  <meta
    name="description"
    content="Explore the MotionC Library: walking, health, recovery, mindset, and MotionC guides."
  >
  <link rel="preload" as="image" href="../images/library.webp" fetchpriority="high">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Libre+Baskerville:wght@400;700&display=swap"
    rel="preload"
    as="style"
    onload="this.onload=null;this.rel='stylesheet'"
  >
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Libre+Baskerville:wght@400;700&display=swap"
      rel="stylesheet"
    >
  </noscript>

  <style>
    * { box-sizing: border-box; }

    :root {
      --ink: #3a291c;
      --blue: #1763a6;
      --green: #287a43;
      --gold: #d79734;
      --paper: #f5dfb8;
      --paper-light: #fff1d2;
      --rail-width: 14.4%;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #19130e;
    }

    body {
      display: grid;
      place-items: center;
      color: var(--ink);
      font-family: "Libre Baskerville", Georgia, serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page {
      position: relative;
      width: min(100vw, 150vh);
      aspect-ratio: 3 / 2;
      overflow: hidden;
      background: url("../images/library.webp") center / 100% 100% no-repeat;
      isolation: isolate;
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      background: url("../images/library-results.webp") center / 100% 100% no-repeat;
      opacity: 0;
      pointer-events: none;
      transition: opacity 240ms ease;
    }

    .page.results-view::before {
      opacity: 1;
    }

    /* Wider Library version of the standard MotionC menu. */
    .library-sidebar {
      position: absolute;
      inset: 0 auto 0 0;
      z-index: 8;
      width: var(--rail-width);
      overflow: hidden;
      background: transparent;
    }

    .sidebar-link {
      position: absolute;
      z-index: 2;
      left: 50%;
      width: 67%;
      height: 9.7%;
      border: 3px solid transparent;
      border-radius: 12px;
      transform: translateX(-50%);
      background: transparent;
    }

    .sidebar-link:hover,
    .sidebar-link:focus-visible,
    .sidebar-link.active {
      outline: none;
      border-color: #f0b429;
      background: rgba(240, 180, 41, .10);
      box-shadow: 0 0 15px rgba(240, 180, 41, .45);
    }

    .sidebar-link.home { top: 14.3%; }
    .sidebar-link.walking { top: 25.1%; }
    .sidebar-link.mcp { top: 36.7%; }
    .sidebar-link.library { top: 47.2%; }
    .sidebar-link.drop-zone { top: 57.3%; }
    .sidebar-link.settings { top: 67%; }

    /* Invisible category targets over the printed Library Index artwork. */
    .index-hotspots {
      position: absolute;
      z-index: 6;
      left: 35.5%;
      top: 58.8%;
      width: 36.9%;
      height: 28.5%;
      transition: opacity 180ms ease;
    }

    .index-hotspots[hidden] {
      display: none;
    }

    .index-choice {
      position: absolute;
      width: 42%;
      height: 16%;
      border: 2px solid transparent;
      border-radius: 8px;
      background: transparent;
    }

    .index-choice:hover,
    .index-choice:focus-visible {
      outline: none;
      border-color: rgba(215, 151, 52, .72);
      background: rgba(255, 239, 197, .16);
      box-shadow: 0 0 12px rgba(215, 151, 52, .38);
    }

    .index-choice.walking { left: 5%; top: 24%; }
    .index-choice.recovery { left: 5%; top: 45%; }
    .index-choice.nutrition { left: 5%; top: 65%; }
    .index-choice.mindset { right: 5%; top: 24%; }
    .index-choice.metrics { right: 5%; top: 45%; }
    .index-choice.guides { right: 5%; top: 65%; }

    .book-transition {
      position: absolute;
      z-index: 7;
      left: 35.5%;
      top: 58.8%;
      width: 36.9%;
      height: 28.5%;
      overflow: hidden;
      pointer-events: none;
      perspective: 900px;
    }

    .book-transition::after {
      content: "";
      position: absolute;
      inset: 3% 5%;
      border-radius: 50% 44% 12% 10% / 8% 8% 12% 12%;
      background:
        linear-gradient(90deg, rgba(246, 220, 172, .84), rgba(255, 243, 214, .96));
      box-shadow: 0 4px 14px rgba(81, 47, 17, .28);
      opacity: 0;
      transform: rotateY(-88deg);
      transform-origin: center;
    }

    .page.turning-book .book-transition::after {
      animation: library-page-turn 440ms ease-in-out;
    }

    @keyframes library-page-turn {
      0% { opacity: 0; transform: rotateY(-88deg) scale(.97); }
      32% { opacity: .86; transform: rotateY(-28deg) scale(.99); }
      52% { opacity: .96; transform: rotateY(0) scale(1); }
      72% { opacity: .82; transform: rotateY(30deg) scale(.99); }
      100% { opacity: 0; transform: rotateY(88deg) scale(.97); }
    }

    /* Keep the book still while its contents change. */
    .book-transition { display: none; }

    /* Results text sits directly over the authentic blank book artwork. */
    .book-interface {
      position: absolute;
      z-index: 5;
      left: 35.5%;
      top: 58.8%;
      width: 36.9%;
      height: 28.5%;
      color: #38271b;
      transform-origin: center bottom;
    }

    .book-pages {
      position: absolute;
      inset: 0;
      transition: opacity 180ms ease;
    }

    .book-page {
      position: absolute;
      top: 5%;
      bottom: 10%;
      width: 43%;
      overflow: hidden;
      padding: 3% 4%;
      background: transparent;
    }

    .book-page.left {
      left: 5%;
      padding-right: 1%;
      padding-left: 7%;
      text-align: left;
    }

    .book-page.right {
      right: 5%;
      padding-right: 7%;
      padding-left: 1%;
      text-align: left;
    }

    .book-title {
      display: grid;
      min-height: 2.3em;
      margin: 0 0 3%;
      padding: 0 6%;
      align-content: center;
      color: #51331c;
      font-size: clamp(11px, 1.16vw, 19px);
      line-height: 1.08;
      text-align: center;
    }

    .book-title.explore-title {
      transform: translateX(-4%);
    }

    .book-subtitle {
      min-height: 1.35em;
      margin: 0 0 3%;
      color: #80552a;
      font: 700 clamp(7px, .62vw, 11px) "Kalam", cursive;
      line-height: 1.2;
      text-align: center;
    }

    .book-list {
      display: grid;
      gap: clamp(4px, .4vw, 7px);
      margin: 0;
      padding: 0;
      align-content: start;
      list-style: none;
    }

    .book-list li { min-width: 0; }

    .book-choice {
      display: flex;
      width: 100%;
      height: clamp(38px, 3vw, 52px);
      padding: clamp(6px, .55vw, 9px) 3%;
      align-items: center;
      justify-content: center;
      border: 0;
      border-bottom: 1px solid rgba(126, 79, 34, .38);
      color: #38271b;
      background: rgba(255, 244, 218, .06);
      font-size: clamp(9px, .9vw, 15px);
      line-height: 1.15;
      text-align: center;
    }

    .book-choice:hover,
    .book-choice:focus-visible {
      outline: none;
      color: #0e568f;
      background: rgba(255, 249, 224, .52);
      box-shadow: inset 0 -2px #d79734;
    }

    .book-choice.category {
      font-weight: 700;
      text-align: center;
    }

    .book-footer {
      position: absolute;
      left: 27%;
      right: 27%;
      bottom: 1%;
      display: flex;
      justify-content: center;
      gap: 5%;
    }

    .book-footer button {
      min-height: clamp(20px, 1.8vw, 31px);
      padding: 0 8%;
      border: 1px solid #956126;
      border-radius: 999px;
      color: #4c321b;
      background: rgba(249, 226, 183, .95);
      font: 700 clamp(7px, .65vw, 11px) "Kalam", cursive;
    }

    .book-footer button:hover,
    .book-footer button:focus-visible {
      outline: 2px solid #f0b429;
      background: #fff0cc;
    }

    .book-footer button[hidden] {
      display: none;
    }

    .empty-result {
      margin: 20% 4% 0;
      color: #725232;
      font: clamp(8px, .82vw, 14px) "Kalam", cursive;
      text-align: center;
    }

    /* The illustrated magnifying glass remains visible beneath this hotspot. */
    .magnifier-hotspot {
      position: absolute;
      z-index: 7;
      left: 72.2%;
      top: 61.8%;
      width: 12.5%;
      height: 20.5%;
      border: 0;
      border-radius: 48%;
      background: transparent;
    }

    .magnifier-hotspot::after {
      content: "";
      position: absolute;
      inset: 7%;
      border: 3px solid transparent;
      border-radius: 50%;
      transition: border-color 180ms ease, box-shadow 180ms ease, transform 180ms ease;
    }

    .magnifier-hotspot:hover::after,
    .magnifier-hotspot:focus-visible::after {
      border-color: rgba(255, 211, 111, .8);
      box-shadow: 0 0 18px rgba(255, 202, 73, .78);
      transform: translateY(-2px);
    }

    .magnifier-hotspot:focus-visible {
      outline: none;
    }

    .search-panel {
      position: absolute;
      z-index: 9;
      left: 40%;
      top: 52.5%;
      width: 29%;
      display: flex;
      gap: 2%;
      padding: .7%;
      border: 2px solid #b87b2d;
      border-radius: 999px;
      background: rgba(255, 237, 201, .97);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .42);
      opacity: 0;
      transform: translateY(18px) scale(.94);
      pointer-events: none;
      transition: opacity 260ms ease, transform 260ms ease;
    }

    .search-panel.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .search-panel input {
      flex: 1;
      min-width: 0;
      border: 0;
      border-radius: 999px;
      padding: 0 5%;
      color: #38271b;
      background: rgba(255, 255, 255, .82);
      font-size: clamp(9px, .86vw, 15px);
    }

    .search-panel input:focus {
      outline: 3px solid rgba(240, 180, 41, .65);
    }

    .search-panel button {
      min-width: 20%;
      border: 0;
      border-radius: 999px;
      color: #fff;
      background: #805323;
      font: 700 clamp(8px, .72vw, 13px) "Kalam", cursive;
    }

    .search-panel button:hover,
    .search-panel button:focus-visible {
      outline: 2px solid #f0b429;
      background: #60401e;
    }

    /* Large reading page. It grows out of the book instead of appearing abruptly. */
    .reader-overlay {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 4%;
      background: rgba(22, 14, 8, .57);
      backdrop-filter: blur(3px);
      opacity: 0;
      transition: opacity 520ms ease;
    }

    .reader-overlay[hidden] {
      display: none;
    }

    .reader-overlay.open {
      opacity: 1;
    }

    .reader-sheet {
      position: relative;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      align-content: start;
      width: 84%;
      height: 88%;
      overflow: hidden;
      padding: clamp(30px, 4.5vw, 76px) clamp(36px, 7vw, 118px)
        clamp(54px, 5.5vw, 92px);
      border: 3px solid #b87b2d;
      border-radius: 20px 34px 22px 30px;
      color: #37291f;
      background:
        linear-gradient(95deg, rgba(168, 121, 63, .10), transparent 12%, transparent 88%, rgba(121, 79, 34, .10)),
        repeating-linear-gradient(0deg, rgba(113, 76, 34, .025) 0 1px, transparent 1px 5px),
        #fff4d9;
      box-shadow: 0 22px 70px rgba(0, 0, 0, .66);
      opacity: 0;
      transform: translateY(22%) scale(.64);
      transform-origin: 50% 80%;
      transition:
        opacity 520ms ease,
        transform 620ms cubic-bezier(.2, .78, .2, 1);
    }

    .reader-overlay.open .reader-sheet {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .reader-sheet::before {
      content: "";
      position: absolute;
      inset: 2.5%;
      border: 1px solid rgba(149, 97, 38, .28);
      border-radius: 12px 22px 13px 20px;
      pointer-events: none;
    }

    .reader-heading {
      position: relative;
      z-index: 1;
      display: grid;
      align-content: end;
      min-height: 2.2em;
      margin: 0 auto .6%;
      max-width: 26ch;
      color: #4d301a;
      font-size: clamp(25px, 2.8vw, 48px);
      line-height: 1.1;
      text-align: center;
    }

    .reader-category {
      position: relative;
      z-index: 1;
      min-height: 1.35em;
      margin: 0 0 1.8%;
      color: #287a43;
      font: 700 clamp(11px, 1vw, 17px) "Kalam", cursive;
      text-align: center;
    }

    .reader-content {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 76ch;
      min-height: 0;
      max-height: 100%;
      overflow: auto;
      scrollbar-gutter: stable;
      margin: 0 auto;
      padding: 0 clamp(2px, .8vw, 14px) .75rem;
      font-size: clamp(12px, 1.12vw, 19px);
      line-height: 1.72;
    }

    .reader-content p {
      margin: 0 0 1em;
    }

    .reader-content > :first-child {
      margin-top: 0;
    }

    .reader-content > :last-child {
      margin-bottom: 0;
    }

    .reader-content p:first-child::first-letter {
      float: left;
      margin: .06em .12em 0 0;
      color: #9b6227;
      font-size: 3.2em;
      font-weight: 700;
      line-height: .82;
    }

    .reader-controls {
      position: absolute;
      z-index: 2;
      left: 6%;
      right: 6%;
      bottom: 3.7%;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 2%;
    }

    .reader-controls button {
      min-height: clamp(33px, 3vw, 50px);
      border: 1px solid #9d682e;
      border-radius: 8px;
      color: #fff;
      background: #765026;
      font: 700 clamp(9px, .9vw, 15px) "Kalam", cursive;
    }

    .reader-controls button:hover,
    .reader-controls button:focus-visible {
      outline: 3px solid #f0b429;
      background: #5d3d1d;
    }

    .reader-controls button:disabled {
      cursor: default;
      opacity: .35;
      filter: grayscale(1);
    }

    .reader-index {
      justify-self: start;
    }

    .reader-page-number {
      color: #765638;
      font: 700 clamp(9px, .8vw, 14px) "Kalam", cursive;
    }

    .reader-page-buttons {
      display: flex;
      justify-self: end;
      gap: 8px;
    }

    .reader-page-buttons button {
      min-width: clamp(42px, 4vw, 68px);
    }

    @media (max-width: 800px), (max-height: 560px) {
      .book-page { padding: 2.5% 3%; }
      .book-choice { min-height: 16px; }
      .reader-sheet { padding-top: 24px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 1ms !important;
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <nav class="library-sidebar" aria-label="MotionC sections">
      <a class="sidebar-link home" href="/landing-page/" aria-label="Open Home"></a>
      <a class="sidebar-link walking" href="/walking/" aria-label="Open Walking"></a>
      <a class="sidebar-link mcp" href="/dashboard/" aria-label="Open MCP"></a>
      <span
        class="sidebar-link library active"
        aria-label="Library — current page"
        aria-current="page"
      ></span>
      <a class="sidebar-link drop-zone" href="/drop-zone/" aria-label="Open Drop Zone"></a>
      <button
        class="sidebar-link settings"
        type="button"
        aria-label="Open Settings"
        title="Settings"
      ></button>
    </nav>

    <section class="index-hotspots" id="indexHotspots" aria-label="Library sections">
      <button
        class="index-choice walking"
        type="button"
        data-category="walking"
        aria-label="Open Walking and Movement"
      ></button>
      <button
        class="index-choice recovery"
        type="button"
        data-category="recovery"
        aria-label="Open Sleep and Recovery"
      ></button>
      <button
        class="index-choice nutrition"
        type="button"
        data-category="nutrition"
        aria-label="Open Food and Nutrition"
      ></button>
      <button
        class="index-choice mindset"
        type="button"
        data-category="mindset"
        aria-label="Open Mindset and Habits"
      ></button>
      <button
        class="index-choice metrics"
        type="button"
        data-category="metrics"
        aria-label="Open Weight and Body Metrics"
      ></button>
      <button
        class="index-choice guides"
        type="button"
        data-category="guides"
        aria-label="Open MotionC Guides"
      ></button>
    </section>

    <div class="book-transition" aria-hidden="true"></div>

    <section class="book-interface" aria-label="Library book">
      <div class="book-pages" id="bookPages" hidden>
        <div class="book-page left" id="leftBookPage"></div>
        <div class="book-page right" id="rightBookPage"></div>
      </div>
      <div class="book-footer">
        <button id="bookPrevious" type="button" hidden>← Previous</button>
        <button id="bookIndex" type="button" hidden>Library Index</button>
        <button id="bookNext" type="button" hidden>Next →</button>
      </div>
    </section>

    <button
      class="magnifier-hotspot"
      id="magnifierHotspot"
      type="button"
      aria-label="Search the MotionC Library"
      aria-controls="searchPanel"
      aria-expanded="false"
      title="Search the Library"
    ></button>

    <form class="search-panel" id="searchPanel" role="search">
      <input
        id="librarySearch"
        type="search"
        autocomplete="off"
        placeholder="Search the Library…"
        aria-label="Search Library articles"
      >
      <button type="submit">Search</button>
    </form>

    <section
      class="reader-overlay"
      id="readerOverlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="readerHeading"
      hidden
    >
      <article class="reader-sheet">
        <h1 class="reader-heading" id="readerHeading"></h1>
        <p class="reader-category" id="readerCategory"></p>
        <div class="reader-content" id="readerContent"></div>

        <div class="reader-controls">
          <button class="reader-index" id="readerIndex" type="button">
            ← Library Index
          </button>

          <span class="reader-page-number" id="readerPageNumber"></span>

          <div class="reader-page-buttons">
            <button id="readerPrevious" type="button" aria-label="Previous article page">
              ←
            </button>
            <button id="readerNext" type="button" aria-label="Next article page">
              →
            </button>
          </div>
        </div>
      </article>
    </section>
  </main>

  <script>
    const categories = [
      {
        id: "walking",
        title: "Walking & Movement",
        description: "Routes, movement, and everyday activity."
      },
      {
        id: "metrics",
        title: "Weight & Body Metrics",
        description: "Understand the numbers without becoming the numbers."
      },
      {
        id: "nutrition",
        title: "Food & Nutrition",
        description: "Practical fuel for daily life."
      },
      {
        id: "recovery",
        title: "Sleep & Recovery",
        description: "Rest, renewal, and sustainable progress."
      },
      {
        id: "mindset",
        title: "Mindset & Habits",
        description: "The quieter side of lasting change."
      },
      {
        id: "guides",
        title: "MotionC Guides",
        description: "How MotionC ideas and tools work."
      }
    ];

    /*
      Starter catalogue:
      Replace or expand these entries with finished MotionC articles.
      Each string inside `pages` becomes one reader page.
    */
    const articles = [
      {
        id: "mindful-walking",
        category: "walking",
        title: "Mindful Walking",
        tags: ["walking", "mindfulness", "outdoors", "attention"],
        summary: "Turn an ordinary walk into time that restores both body and mind.",
        pages: [
          `<p>A walk does not need to be fast, long, or impressive to matter. It only needs your attention. Mindful walking begins when you notice the rhythm of your steps, the feeling of the ground, and the small details that usually pass unnoticed.</p>
           <p>Leave a little room between yourself and the numbers. Pace and distance can be useful, but they do not have to occupy every walk.</p>`,
          `<p>Try choosing one sense at a time. Notice sound for several minutes, then colour, temperature, or the movement of your breathing.</p>
           <p>The goal is not to empty your mind. It is to return gently to the walk whenever your thoughts carry you elsewhere.</p>`
        ]
      },
      {
        id: "walking-consistency",
        category: "walking",
        title: "The Power of the Ordinary Walk",
        tags: ["walking", "consistency", "movement", "routine"],
        summary: "Why repeatable walks often matter more than occasional heroic efforts.",
        pages: [
          `<p>Consistency rarely looks dramatic. It looks like taking the familiar route, putting on your shoes when motivation is quiet, and allowing modest effort to accumulate.</p>
           <p>An ordinary walk is powerful because it can be repeated. What fits into real life has a chance to become part of real life.</p>`,
          `<p>Measure success by more than distance. Showing up, protecting the habit, and returning after an interruption are all forms of progress.</p>
           <p>The walk you can do again tomorrow may be more valuable than the one that exhausts every reserve today.</p>`
        ]
      },
      {
        id: "visceral-fat",
        category: "metrics",
        title: "Understanding Visceral Fat",
        tags: ["visceral fat", "waist", "health", "body composition"],
        summary: "A plain-language look at the fat stored around internal organs.",
        pages: [
          `<p>Body weight alone cannot describe where fat is stored. Visceral fat sits deeper in the abdomen around internal organs, which makes waist-related measurements useful alongside weight.</p>
           <p>No single home measurement is a diagnosis. Trends are most helpful when viewed over time and interpreted in context.</p>`,
          `<p>Waist circumference and waist-to-height ratio can add information that a scale cannot provide by itself.</p>
           <p>Use measurements as signals for informed action—not as verdicts about your worth or your effort.</p>`
        ]
      },
      {
        id: "numbers-not-verdicts",
        category: "metrics",
        title: "Numbers Are Information, Not Verdicts",
        tags: ["weight", "measurements", "progress", "tracking"],
        summary: "A healthier way to interpret day-to-day measurements.",
        pages: [
          `<p>A measurement is one observation taken under one set of conditions. Hydration, meals, sleep, timing, and ordinary variation can all influence what appears on the screen.</p>
           <p>The useful question is not “Was this number good?” but “What does the longer pattern suggest?”</p>`,

      {

    const categoryMap = new Map(categories.map(category => [category.id, category]));
    const page = document.querySelector(".page");
    const indexHotspots = document.getElementById("indexHotspots");
    const bookPages = document.getElementById("bookPages");
    const leftBookPage = document.getElementById("leftBookPage");
    const rightBookPage = document.getElementById("rightBookPage");
    const bookPrevious = document.getElementById("bookPrevious");
    const bookNext = document.getElementById("bookNext");
    const bookIndex = document.getElementById("bookIndex");
    const magnifierHotspot = document.getElementById("magnifierHotspot");
    const searchPanel = document.getElementById("searchPanel");
    const librarySearch = document.getElementById("librarySearch");
    const readerOverlay = document.getElementById("readerOverlay");
    const readerHeading = document.getElementById("readerHeading");
    const readerCategory = document.getElementById("readerCategory");
    const readerContent = document.getElementById("readerContent");
    const readerPageNumber = document.getElementById("readerPageNumber");
    const readerPrevious = document.getElementById("readerPrevious");
    const readerNext = document.getElementById("readerNext");
    const readerIndex = document.getElementById("readerIndex");

    let currentMode = "index";
    let currentResults = [];
    let currentResultTitle = "";
    let resultSpread = 0;
    let activeArticle = null;
    let activeArticlePage = 0;

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function turnBook(update) {
      page.classList.remove("turning-book");
      update();
    }

    function categoryButton(category, index) {
      return `
        <li>
          <button class="book-choice category" type="button" data-category="${category.id}">
            ${index + 1}. ${escapeHtml(category.title)}
          </button>
        </li>
      `;
    }

    function renderIndex() {
      currentMode = "index";
      resultSpread = 0;
      page.classList.remove("results-view");
      indexHotspots.hidden = false;
      bookPages.hidden = true;
      leftBookPage.replaceChildren();
      rightBookPage.replaceChildren();

      bookPrevious.hidden = true;
      bookNext.hidden = true;
      bookIndex.hidden = true;
    }

    function articleButton(article) {
      return `
        <li>
          <button class="book-choice" type="button" data-article="${article.id}">
            ${escapeHtml(article.title)}
          </button>
        </li>
      `;
    }

    function renderResults() {
      page.classList.add("results-view");
      indexHotspots.hidden = true;
      bookPages.hidden = false;

      const perSpread = 6;
      const start = resultSpread * perSpread;
      const spreadArticles = currentResults.slice(start, start + perSpread);
      const splitAt = Math.ceil(spreadArticles.length / 2);
      const leftArticles = spreadArticles.slice(0, splitAt);
      const rightArticles = spreadArticles.slice(splitAt);
      const totalSpreads = Math.max(1, Math.ceil(currentResults.length / perSpread));

      leftBookPage.innerHTML = `
        <h2 class="book-title">${escapeHtml(currentResultTitle)}</h2>
        <p class="book-subtitle">
          ${currentResults.length} ${currentResults.length === 1 ? "article" : "articles"} found
        </p>
        ${
          leftArticles.length
            ? `<ul class="book-list">${leftArticles.map(articleButton).join("")}</ul>`
            : `<p class="empty-result">No matching articles were found.<br>Try another word or subject.</p>`
        }
      `;

      rightBookPage.innerHTML = `
        <h2 class="book-title explore-title">${rightArticles.length ? "More to Explore" : ""}</h2>
        <p class="book-subtitle">Spread ${resultSpread + 1} of ${totalSpreads}</p>
        ${
          rightArticles.length
            ? `<ul class="book-list">${rightArticles.map(articleButton).join("")}</ul>`
            : ``
        }
      `;

      bookIndex.hidden = false;
      bookPrevious.hidden = resultSpread === 0;
      bookNext.hidden = resultSpread >= totalSpreads - 1;
    }

    function showCategory(categoryId) {
      const category = categoryMap.get(categoryId);
      if (!category) return;

      currentMode = "results";
      currentResults = articles.filter(article => article.category === categoryId);
      currentResultTitle = category.title;
      resultSpread = 0;
      turnBook(renderResults);
    }

    function searchArticles(query) {
      const words = query
        .toLowerCase()
        .trim()
        .split(/\s+/)
        .filter(Boolean);

      if (!words.length) {
        turnBook(renderIndex);
        return;
      }

      currentMode = "results";
      currentResultTitle = `Search: “${query.trim()}”`;
      currentResults = articles.filter(article => {
        const category = categoryMap.get(article.category);
        const searchable = [
          article.title,
          article.summary,
          article.tags.join(" "),
          category?.title || "",
          article.pages.join(" ")
        ].join(" ").toLowerCase();

        return words.every(word => searchable.includes(word));
      });
      resultSpread = 0;
      turnBook(renderResults);
    }

    function renderReaderPage() {
      if (!activeArticle) return;
      readerHeading.textContent = activeArticle.title;
      readerCategory.textContent = categoryMap.get(activeArticle.category)?.title || "MotionC Library";
      readerContent.innerHTML = activeArticle.pages[activeArticlePage];
      readerPageNumber.textContent =
        `Page ${activeArticlePage + 1} of ${activeArticle.pages.length}`;
      readerPrevious.disabled = activeArticlePage === 0;
      readerNext.disabled = activeArticlePage >= activeArticle.pages.length - 1;
    }

    function openArticle(articleId) {
      activeArticle = articles.find(article => article.id === articleId);
      if (!activeArticle) return;

      activeArticlePage = 0;
      renderReaderPage();
      readerOverlay.hidden = false;
      requestAnimationFrame(() => {
        readerOverlay.classList.add("open");
        readerIndex.focus();
      });
    }

    function closeReaderToIndex() {
      readerOverlay.classList.remove("open");
      window.setTimeout(() => {
        readerOverlay.hidden = true;
        activeArticle = null;
        turnBook(renderIndex);
      }, 540);
    }

    document.addEventListener("click", event => {
      const categoryButton = event.target.closest("[data-category]");
      if (categoryButton) {
        showCategory(categoryButton.dataset.category);
        return;
      }

      const articleButton = event.target.closest("[data-article]");
      if (articleButton) {
        openArticle(articleButton.dataset.article);
      }
    });

    bookIndex.addEventListener("click", () => turnBook(renderIndex));

    bookPrevious.addEventListener("click", () => {
      if (resultSpread <= 0) return;
      resultSpread -= 1;
      turnBook(renderResults);
    });

    bookNext.addEventListener("click", () => {
      const totalSpreads = Math.ceil(currentResults.length / 6);
      if (resultSpread >= totalSpreads - 1) return;
      resultSpread += 1;
      turnBook(renderResults);
    });

    magnifierHotspot.addEventListener("click", () => {
      const open = !searchPanel.classList.contains("open");
      searchPanel.classList.toggle("open", open);
      magnifierHotspot.setAttribute("aria-expanded", String(open));
      if (open) librarySearch.focus();
    });

    searchPanel.addEventListener("submit", event => {
      event.preventDefault();
      searchArticles(librarySearch.value);
      searchPanel.classList.remove("open");
      magnifierHotspot.setAttribute("aria-expanded", "false");
    });

    readerIndex.addEventListener("click", closeReaderToIndex);

    readerPrevious.addEventListener("click", () => {
      if (activeArticlePage <= 0) return;
      activeArticlePage -= 1;
      renderReaderPage();
    });

    readerNext.addEventListener("click", () => {
      if (!activeArticle || activeArticlePage >= activeArticle.pages.length - 1) return;
      activeArticlePage += 1;
      renderReaderPage();
    });

    document.addEventListener("keydown", event => {
      if (event.key !== "Escape") return;

      if (!readerOverlay.hidden) {
        closeReaderToIndex();
        return;
      }

      if (searchPanel.classList.contains("open")) {
        searchPanel.classList.remove("open");
        magnifierHotspot.setAttribute("aria-expanded", "false");
        magnifierHotspot.focus();
      }
    });

    renderIndex();
  </script>
</body>
