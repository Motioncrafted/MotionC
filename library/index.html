<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MotionC Library</title>
  <meta
    name="description"
    content="Explore the MotionC Library: walking, health, recovery, mindset, and MotionC guides."
  >
  <link rel="preload" as="image" href="../images/library.webp" fetchpriority="high">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Libre+Baskerville:wght@400;700&display=swap"
    rel="preload"
    as="style"
    onload="this.onload=null;this.rel='stylesheet'"
  >
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Libre+Baskerville:wght@400;700&display=swap"
      rel="stylesheet"
    >
  </noscript>

  <style>
    * { box-sizing: border-box; }

    :root {
      --ink: #3a291c;
      --blue: #1763a6;
      --green: #287a43;
      --gold: #d79734;
      --paper: #f5dfb8;
      --paper-light: #fff1d2;
      --rail-width: 14.4%;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #19130e;
    }

    body {
      display: grid;
      place-items: center;
      color: var(--ink);
      font-family: "Libre Baskerville", Georgia, serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page {
      position: relative;
      width: min(100vw, 150vh);
      aspect-ratio: 3 / 2;
      overflow: hidden;
      background: url("../images/library-index-ornament.png") center / 100% 100% no-repeat;
      isolation: isolate;
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      background: url("../images/library-results.webp") center / 100% 100% no-repeat;
      opacity: 0;
      pointer-events: none;
      transition: opacity 240ms ease;
    }

    .page.results-view::before {
      opacity: 1;
    }

    /* Shared MotionC navigation, rebuilt over the artwork's original rail. */
    .motionc-sidebar {
      position: absolute;
      inset: 0 auto 0 0;
      z-index: 20;
      display: flex;
      width: var(--rail-width);
      padding: 1.6% .7% 1.5%;
      flex-direction: column;
      overflow: visible;
      background: linear-gradient(180deg, #132522, #0a1716);
      box-shadow: 6px 0 18px rgba(0, 0, 0, .12);
      font-family: Arial, sans-serif;
    }

    .motionc-brand {
      display: grid;
      width: clamp(42px, 5.4vw, 68px);
      aspect-ratio: 1;
      margin: 0 auto clamp(10px, 1.35vh, 18px);
      padding: 3px;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, .24);
      border-radius: 17px;
      background: #183831;
      box-shadow: inset 0 1px rgba(255, 255, 255, .1), 0 7px 18px rgba(0, 0, 0, .2);
    }

    .motionc-brand img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .motionc-nav {
      display: grid;
      min-height: 0;
      flex: 1;
      grid-template-rows: repeat(6, minmax(0, 1fr));
      gap: 2px;
    }

    .motionc-nav a,
    .mobile-more-toggle {
      position: relative;
      display: grid;
      min-height: 0;
      padding: 3px 1px;
      place-items: center;
      align-content: center;
      gap: 3px;
      border: 1px solid transparent;
      border-radius: 12px;
      color: rgba(255, 255, 255, .74);
      background: transparent;
      text-decoration: none;
    }

    .motionc-nav a img {
      width: clamp(26px, 3.2vw, 42px);
      height: clamp(26px, 3.2vw, 42px);
      object-fit: contain;
    }

    .motionc-nav a small,
    .mobile-more-toggle small {
      font-size: clamp(7px, .76vw, 11px);
      font-weight: 800;
      letter-spacing: .05em;
      line-height: 1;
      text-align: center;
      text-transform: uppercase;
    }

    .motionc-nav a:hover,
    .motionc-nav a:focus-visible,
    .motionc-nav a.active {
      border-color: transparent;
      color: #fff;
      background: transparent;
      outline: none;
    }

    .motionc-nav a.active img {
      box-sizing: border-box;
      width: clamp(40px, 4.55vw, 58px);
      height: clamp(40px, 4.55vw, 58px);
      padding: clamp(6px, .7vw, 9px);
      border: 1px solid rgba(183, 221, 199, .42);
      border-radius: 15px;
      background: linear-gradient(145deg, rgba(53, 102, 73, .96), rgba(31, 73, 52, .96));
      box-shadow: inset 0 1px rgba(255, 255, 255, .14), 0 7px 14px rgba(0, 0, 0, .24);
    }

    .motionc-nav a.active small { color: #eef8ef; }

    .motionc-nav a::before,
    .mobile-more-toggle::before {
      position: absolute;
      z-index: 3;
      top: 1px;
      left: 50%;
      width: clamp(43px, 4.9vw, 64px);
      height: clamp(43px, 4.9vw, 64px);
      border: 3px solid #f0b429;
      border-radius: 14px;
      content: "";
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%);
    }

    .nav-visualization .motionc-nav a:hover::before,
    .nav-visualization .motionc-nav a:focus-visible::before,
    .nav-visualization .mobile-more-toggle:hover::before,
    .nav-visualization .mobile-more-toggle:focus-visible::before,
    .nav-visualization .mobile-more-toggle:active::before {
      opacity: 1;
      box-shadow: 0 0 14px rgba(240, 180, 41, .6);
    }

    .mobile-more-toggle,
    .mobile-more-menu { display: none; }

    .preferences-menu {
      position: absolute;
      z-index: 70;
      top: 2%;
      left: calc(var(--rail-width) + 1.2%);
      width: 225px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 13px;
      color: #17352c;
      background: rgba(255, 255, 255, .97);
      box-shadow: 0 14px 32px rgba(0, 0, 0, .24);
      font-family: Arial, sans-serif;
    }

    .preferences-menu[hidden] { display: none; }
    .preferences-menu > strong { display: block; font-size: 16px; }
    .preferences-menu > p { margin: 5px 0 12px; color: #687771; font-size: 11px; }

    .preferences-menu label {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      padding: 9px;
      align-items: center;
      border-radius: 8px;
      background: #f2f6f2;
      cursor: pointer;
      font-size: 12px;
      font-weight: 800;
    }

    .preferences-menu label small { margin-left: auto; color: #728078; }

    .preferences-close {
      position: absolute;
      top: 7px;
      right: 8px;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      border-radius: 7px;
      color: #607069;
      background: transparent;
      font-size: 21px;
      line-height: 1;
    }

    .preferences-close:hover,
    .preferences-close:focus-visible {
      color: #17352c;
      background: #e8efe9;
      outline: none;
    }

    /* Invisible category targets over the printed Library Index artwork. */
    .index-hotspots {
      position: absolute;
      z-index: 6;
      left: 35.5%;
      top: 58.8%;
      width: 36.9%;
      height: 28.5%;
      transition: opacity 180ms ease;
    }

    .index-hotspots[hidden] {
      display: none;
    }

    .index-choice {
      position: absolute;
      width: 42%;
      height: 16%;
      border: 2px solid transparent;
      border-radius: 8px;
      background: transparent;
    }

    .index-choice:focus-visible {
      outline: none;
      border-color: rgba(215, 151, 52, .72);
      background: rgba(255, 239, 197, .16);
      box-shadow: 0 0 12px rgba(215, 151, 52, .38);
    }

    .index-choice.walking { left: 5%; top: 24%; }
    .index-choice.recovery { left: 5%; top: 45%; }
    .index-choice.nutrition { left: 5%; top: 65%; }
    .index-choice.mindset { right: 5%; top: 24%; }
    .index-choice.metrics { right: 5%; top: 45%; }
    .index-choice.guides { right: 5%; top: 65%; }

    .book-transition {
      position: absolute;
      z-index: 7;
      left: 35.5%;
      top: 58.8%;
      width: 36.9%;
      height: 28.5%;
      overflow: hidden;
      pointer-events: none;
      perspective: 900px;
    }

    .book-transition::after {
      content: "";
      position: absolute;
      inset: 3% 5%;
      border-radius: 50% 44% 12% 10% / 8% 8% 12% 12%;
      background:
        linear-gradient(90deg, rgba(246, 220, 172, .84), rgba(255, 243, 214, .96));
      box-shadow: 0 4px 14px rgba(81, 47, 17, .28);
      opacity: 0;
      transform: rotateY(-88deg);
      transform-origin: center;
    }

    .page.turning-book .book-transition::after {
      animation: library-page-turn 440ms ease-in-out;
    }

    @keyframes library-page-turn {
      0% { opacity: 0; transform: rotateY(-88deg) scale(.97); }
      32% { opacity: .86; transform: rotateY(-28deg) scale(.99); }
      52% { opacity: .96; transform: rotateY(0) scale(1); }
      72% { opacity: .82; transform: rotateY(30deg) scale(.99); }
      100% { opacity: 0; transform: rotateY(88deg) scale(.97); }
    }

    /* Keep the book still while its contents change. */
    .book-transition { display: none; }

    /* Results text sits directly over the authentic blank book artwork. */
    .book-interface {
      position: absolute;
      z-index: 5;
      left: 35.5%;
      top: 58.8%;
      width: 36.9%;
      height: 28.5%;
      color: #38271b;
      transform-origin: center bottom;
    }

    .book-pages {
      position: absolute;
      inset: 0;
      transition: opacity 180ms ease;
    }

    .book-page {
      position: absolute;
      top: 5%;
      bottom: 10%;
      width: 43%;
      overflow: hidden;
      padding: 3% 4%;
      background: transparent;
    }

    .book-page.left {
      left: 5%;
      padding-right: 1%;
      padding-left: 7%;
      text-align: left;
    }

    .book-page.right {
      right: 5%;
      padding-right: 7%;
      padding-left: 1%;
      text-align: left;
    }

    .book-title {
      display: grid;
      min-height: 2.3em;
      margin: 0 0 3%;
      padding: 0 6%;
      align-content: center;
      color: #51331c;
      font-size: clamp(11px, 1.16vw, 19px);
      line-height: 1.08;
      text-align: center;
    }

    .book-page-label {
      display: grid;
      min-height: 2.3em;
      margin: 0 0 3%;
      padding: 0 6%;
      align-content: center;
      color: #80552a;
      font: 700 clamp(8px, .72vw, 12px) "Kalam", cursive;
      line-height: 1.15;
      text-align: center;
    }

    .book-subtitle {
      min-height: 1.35em;
      margin: 0 0 3%;
      color: #80552a;
      font: 700 clamp(7px, .62vw, 11px) "Kalam", cursive;
      line-height: 1.2;
      text-align: center;
    }

    .book-list {
      display: grid;
      gap: clamp(4px, .4vw, 7px);
      margin: 0;
      padding: 0;
      align-content: start;
      list-style: none;
    }

    .book-list li { min-width: 0; }

    .book-choice {
      display: flex;
      width: 100%;
      height: clamp(38px, 3vw, 52px);
      padding: clamp(6px, .55vw, 9px) 3%;
      align-items: center;
      justify-content: center;
      border: 0;
      border-bottom: 1px solid rgba(126, 79, 34, .38);
      color: #38271b;
      background: rgba(255, 244, 218, .06);
      font-size: clamp(9px, .9vw, 15px);
      line-height: 1.15;
      text-align: center;
    }

    .book-choice:hover,
    .book-choice:focus-visible {
      outline: none;
      color: #0e568f;
      background: rgba(255, 249, 224, .52);
      box-shadow: inset 0 -2px #d79734;
    }

    .book-choice.category {
      font-weight: 700;
      text-align: center;
    }

    .book-footer {
      position: absolute;
      left: 27%;
      right: 27%;
      bottom: 1%;
      display: flex;
      justify-content: center;
      gap: 5%;
    }

    .book-footer button {
      min-height: clamp(20px, 1.8vw, 31px);
      padding: 0 8%;
      border: 1px solid #956126;
      border-radius: 999px;
      color: #4c321b;
      background: rgba(249, 226, 183, .95);
      font: 700 clamp(7px, .65vw, 11px) "Kalam", cursive;
    }

    .book-footer button:hover,
    .book-footer button:focus-visible {
      outline: 2px solid #f0b429;
      background: #fff0cc;
    }

    .book-footer button[hidden] {
      display: none;
    }

    .empty-result {
      margin: 20% 4% 0;
      color: #725232;
      font: clamp(8px, .82vw, 14px) "Kalam", cursive;
      text-align: center;
    }

    /* The illustrated magnifying glass remains visible beneath this hotspot. */
    .magnifier-hotspot {
      position: absolute;
      z-index: 7;
      left: 72.2%;
      top: 61.8%;
      width: 12.5%;
      height: 20.5%;
      border: 0;
      border-radius: 48%;
      background: transparent;
    }

    .magnifier-hotspot::after {
      content: "";
      position: absolute;
      inset: 7%;
      border: 3px solid transparent;
      border-radius: 50%;
      transform: translateX(-22%);
      transition: border-color 180ms ease, box-shadow 180ms ease, transform 180ms ease;
    }

    .magnifier-hotspot:hover::after,
    .magnifier-hotspot:focus-visible::after {
      border-color: rgba(255, 211, 111, .8);
      box-shadow: 0 0 18px rgba(255, 202, 73, .78);
      transform: translate(-22%, -2px);
    }

    .magnifier-hotspot:focus-visible {
      outline: none;
    }

    .search-panel {
      position: absolute;
      z-index: 9;
      left: 40%;
      top: 52.5%;
      width: 29%;
      display: flex;
      gap: 2%;
      padding: .7%;
      border: 2px solid #b87b2d;
      border-radius: 999px;
      background: rgba(255, 237, 201, .97);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .42);
      opacity: 0;
      transform: translateY(18px) scale(.94);
      pointer-events: none;
      transition: opacity 260ms ease, transform 260ms ease;
    }

    .search-panel.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .search-panel input {
      flex: 1;
      min-width: 0;
      border: 0;
      border-radius: 999px;
      padding: 0 5%;
      color: #38271b;
      background: rgba(255, 255, 255, .82);
      font-size: clamp(9px, .86vw, 15px);
    }

    .search-panel input:focus {
      outline: 3px solid rgba(240, 180, 41, .65);
    }

    .search-panel button {
      min-width: 20%;
      border: 0;
      border-radius: 999px;
      color: #fff;
      background: #805323;
      font: 700 clamp(8px, .72vw, 13px) "Kalam", cursive;
    }

    .search-panel button:hover,
    .search-panel button:focus-visible {
      outline: 2px solid #f0b429;
      background: #60401e;
    }

    /* Scrollable section catalogue: a cool MotionC sage layer between book and article. */
    .section-overlay {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 3.2%;
      background: rgba(12, 27, 23, .62);
      backdrop-filter: blur(3px);
      opacity: 0;
      transition: opacity 420ms ease;
    }

    .section-overlay[hidden] { display: none; }
    .section-overlay.open { opacity: 1; }

    .section-sheet {
      position: relative;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      width: 88%;
      height: 91%;
      overflow: hidden;
      padding: clamp(24px, 3.3vw, 54px) clamp(28px, 5vw, 82px) clamp(22px, 2.8vw, 46px);
      border: 3px solid #6f9b82;
      border-radius: 18px 30px 20px 28px;
      color: #18372d;
      background:
        linear-gradient(105deg, rgba(34, 92, 65, .10), transparent 18%, transparent 82%, rgba(34, 92, 65, .10)),
        repeating-linear-gradient(0deg, rgba(25, 72, 53, .025) 0 1px, transparent 1px 5px),
        #edf4ef;
      box-shadow: 0 22px 70px rgba(0, 0, 0, .66);
      opacity: 0;
      transform: translateY(14%) scale(.78);
      transition: opacity 420ms ease, transform 520ms cubic-bezier(.2, .78, .2, 1);
    }

    .section-overlay.open .section-sheet { opacity: 1; transform: none; }
    .section-kicker {
      margin: 0 0 .25em;
      color: #287a43;
      font: 700 clamp(10px, .9vw, 15px) "Kalam", cursive;
      letter-spacing: .12em;
      text-align: center;
      text-transform: uppercase;
    }
    .section-heading {
      margin: 0;
      color: #173f30;
      font-size: clamp(25px, 2.8vw, 48px);
      line-height: 1.1;
      text-align: center;
    }
    .section-description {
      margin: .35em 0 1.1em;
      color: #557166;
      font: 700 clamp(11px, 1vw, 17px) "Kalam", cursive;
      text-align: center;
    }
    .section-content {
      min-height: 0;
      overflow-y: auto;
      scrollbar-gutter: stable;
      padding: 0 clamp(4px, 1vw, 18px) 1rem;
      scrollbar-color: #71a085 #d7e6dc;
    }
    .section-content::-webkit-scrollbar { width: 14px; }
    .section-content::-webkit-scrollbar-track { border-radius: 999px; background: #d7e6dc; }
    .section-content::-webkit-scrollbar-thumb { border: 3px solid #d7e6dc; border-radius: 999px; background: #71a085; }
    .section-article-list { display: grid; gap: 10px; max-width: 78ch; margin: 0 auto; padding: 0; list-style: none; }
    .section-article {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 5px 18px;
      width: 100%;
      padding: clamp(13px, 1.25vw, 20px);
      border: 1px solid #bdd2c5;
      border-radius: 12px;
      color: #18372d;
      background: rgba(255,255,255,.72);
      text-align: left;
      box-shadow: 0 4px 12px rgba(25, 70, 51, .07);
    }
    .section-article:hover,
    .section-article:focus-visible { border-color: #287a43; outline: 3px solid rgba(240,180,41,.75); background: #fff; }
    .section-article strong { font-size: clamp(15px, 1.3vw, 22px); }
    .section-article small { grid-column: 1; color: #5b756b; font-size: clamp(11px, .9vw, 15px); line-height: 1.4; }
    .section-article i { grid-column: 2; grid-row: 1 / span 2; align-self: center; color: #287a43; font-size: 1.4em; font-style: normal; }
    .section-empty { color: #557166; font-style: italic; text-align: center; }
    .section-controls {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      padding-top: 14px;
    }
    .section-controls button {
      min-height: clamp(36px, 3vw, 50px);
      border: 1px solid #4e8067;
      border-radius: 8px;
      padding: 0 1em;
      color: #fff;
      background: #287a43;
      font: 700 clamp(9px, .9vw, 15px) "Kalam", cursive;
    }
    .section-controls button:hover,
    .section-controls button:focus-visible { outline: 3px solid #f0b429; background: #1f6035; }
    .section-controls button:disabled { opacity: .3; }
    #sectionPrevious { justify-self: start; }
    #sectionNext { justify-self: end; }
    .section-count { color: #557166; font: 700 clamp(9px, .8vw, 14px) "Kalam", cursive; }

    /* Large warm reading page above the cool catalogue layer. */
    .reader-overlay {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      padding: 4%;
      background: rgba(22, 14, 8, .57);
      backdrop-filter: blur(3px);
      opacity: 0;
      transition: opacity 520ms ease;
    }

    .reader-overlay[hidden] {
      display: none;
    }

    .reader-overlay.open {
      opacity: 1;
    }

    .reader-sheet {
      position: relative;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      align-content: start;
      width: 84%;
      height: 88%;
      overflow: hidden;
      padding: clamp(30px, 4.5vw, 76px) clamp(36px, 7vw, 118px)
        clamp(54px, 5.5vw, 92px);
      border: 3px solid #b87b2d;
      border-radius: 20px 34px 22px 30px;
      color: #37291f;
      background:
        linear-gradient(95deg, rgba(168, 121, 63, .10), transparent 12%, transparent 88%, rgba(121, 79, 34, .10)),
        repeating-linear-gradient(0deg, rgba(113, 76, 34, .025) 0 1px, transparent 1px 5px),
        #fff4d9;
      box-shadow: 0 22px 70px rgba(0, 0, 0, .66);
      opacity: 0;
      transform: translateY(22%) scale(.64);
      transform-origin: 50% 80%;
      transition:
        opacity 520ms ease,
        transform 620ms cubic-bezier(.2, .78, .2, 1);
    }

    .reader-overlay.open .reader-sheet {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .reader-sheet::before {
      content: "";
      position: absolute;
      inset: 2.5%;
      border: 1px solid rgba(149, 97, 38, .28);
      border-radius: 12px 22px 13px 20px;
      pointer-events: none;
    }

    .reader-heading {
      position: relative;
      z-index: 1;
      display: grid;
      align-content: end;
      min-height: 2.2em;
      margin: 0 auto .6%;
      max-width: 26ch;
      color: #4d301a;
      font-size: clamp(25px, 2.8vw, 48px);
      line-height: 1.1;
      text-align: center;
    }

    .reader-category {
      position: relative;
      z-index: 1;
      min-height: 1.35em;
      margin: 0 0 1.8%;
      color: #287a43;
      font: 700 clamp(11px, 1vw, 17px) "Kalam", cursive;
      text-align: center;
    }

    .reader-content {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 76ch;
      min-height: 0;
      max-height: 100%;
      overflow: auto;
      scrollbar-gutter: stable;
      margin: 0 auto;
      padding: 0 clamp(2px, .8vw, 14px) .75rem;
      font-size: clamp(12px, 1.12vw, 19px);
      line-height: 1.72;
      scrollbar-color: #c49558 #ead8b4;

  <script type="module">
    import { supabase } from "../shared/motionc-supabase.js";
    const categories = [
      {
        id: "walking",
        title: "Walking & Movement",
        description: "Routes, movement, and everyday activity."
      },
      {
        id: "metrics",
        title: "Weight & Body Metrics",
        description: "Understand the numbers without becoming the numbers."
      },
      {
        id: "nutrition",

        description: "Practical fuel for daily life."
      },
      {
        id: "recovery",
        title: "Sleep & Recovery",
        description: "Rest, renewal, and sustainable progress."
      },
      {
        id: "mindset",
        title: "Mindset & Habits",
        description: "The quieter side of lasting change."
      },
      {
        id: "guides",
        title: "MotionC Guides",
        description: "How MotionC ideas and tools work."
      }
    ];

    /*
      Starter catalogue:
      Replace or expand these entries with finished MotionC articles.
      Each string inside `pages` becomes one reader page.
    */
    const fallbackArticles = [
      {
        id: "power-of-a-simple-greeting",
        category: "walking",
        title: "The Power of a Simple Greeting",
        tags: ["walking", "connection", "kindness", "community", "mental well-being", "morning walk"],
        summary: "How a smile, wave, or simple hello can create connection along a shared walking path.",
        pages: [
          `<h2>Introduction: The Morning Walk as a Microcosm of Life</h2>
           <p>Every morning, as I walk along a familiar path, I find myself surrounded by others who share this quiet ritual. These are people who, like me, seek a moment of peace, reflection, or movement to start their day. On this path, I make a small but intentional effort: when passing others, I offer a gentle hello or a slight wave. It’s never pushy or intrusive—just a simple acknowledgment of our shared presence.</p>`,
          `<h2>The Simple Act of Saying Hello</h2>
           <p>This small gesture often receives a warm return—a smile, a nod, or a wave back. It’s a brief but meaningful exchange that creates a subtle sense of connection. These moments remind me that beneath the surface of our busy lives, there is a hidden network of shared humanity. Saying hello is more than politeness; it’s a way of saying, “I see you,” and that acknowledgment can be deeply comforting.</p>
           <h2>The Feeling of Being Seen</h2>
           <p>In our fast-paced, often disconnected daily routines, many people go unnoticed. A simple greeting can leave someone with the rare and precious feeling of being seen or acknowledged. This recognition, even if fleeting, can uplift spirits and remind us that we are not alone. It’s a small act that fills a gap often left by the anonymity of modern life.</p>`,
          `<h2>The Unseen Stories Behind Each Passerby</h2>
           <p>Of course, not everyone responds. Some people walk by without a glance, absorbed in their own thoughts or struggles. At first, this bothered me. But I’ve come to understand that everyone truly has their own “path to walk.” We don’t know the stories, challenges, or emotions that others carry with them. Perhaps my smile or hello is a small light in their day, even if they don’t outwardly show it.</p>
           <h2>Why These Moments Matter</h2>
           <p>These brief interactions may seem insignificant, but they hold real power. Small social connections can improve mental well-being, reduce feelings of isolation, and foster a sense of community. When we acknowledge others, we contribute to a ripple effect of kindness that can extend far beyond the moment.</p>`,
          `<h2>Conclusion: Embracing Our Shared Journey</h2>
           <p>Our daily paths are more than just routes from point A to point B—they are opportunities for connection, empathy, and kindness. By embracing the simple act of greeting others, we nurture the hidden bonds that unite us all. So next time you pass someone on your path, offer a smile or a hello. You might just brighten their day—and yours.</p>`
        ]
      },
      {
        id: "mindful-walking",
        category: "walking",
        title: "Mindful Walking",
        tags: ["walking", "mindfulness", "outdoors", "attention"],
        summary: "Turn an ordinary walk into time that restores both body and mind.",
        pages: [
          `<p>A walk does not need to be fast, long, or impressive to matter. It only needs your attention. Mindful walking begins when you notice the rhythm of your steps, the feeling of the ground, and the small details that usually pass unnoticed.</p>
           <p>Leave a little room between yourself and the numbers. Pace and distance can be useful, but they do not have to occupy every walk.</p>`,
          `<p>Try choosing one sense at a time. Notice sound for several minutes, then colour, temperature, or the movement of your breathing.</p>
           <p>The goal is not to empty your mind. It is to return gently to the walk whenever your thoughts carry you elsewhere.</p>`
        ]
      },
      {
        id: "walking-consistency",
        category: "walking",
        title: "The Power of the Ordinary Walk",
        tags: ["walking", "consistency", "movement", "routine"],
        summary: "Why repeatable walks often matter more than occasional heroic efforts.",
        pages: [
          `<p>Consistency rarely looks dramatic. It looks like taking the familiar route, putting on your shoes when motivation is quiet, and allowing modest effort to accumulate.</p>
           <p>An ordinary walk is powerful because it can be repeated. What fits into real life has a chance to become part of real life.</p>`,
          `<p>Measure success by more than distance. Showing up, protecting the habit, and returning after an interruption are all forms of progress.</p>
           <p>The walk you can do again tomorrow may be more valuable than the one that exhausts every reserve today.</p>`
        ]
      },
      {
        id: "visceral-fat",
        category: "metrics",
        title: "Understanding Visceral Fat",
        tags: ["visceral fat", "waist", "waist-to-hip ratio", "health", "body composition", "walking", "nutrition"],
        summary: "What visceral fat is, why it matters, and the practical ways it can be estimated or measured.",
        pages: [
          `<h2>What It Is, Why It Matters, and How to Measure It</h2>
           <p>If you’ve never heard of <strong>visceral fat</strong> before, you’re not alone. It’s one of those health terms that doesn’t come up in everyday conversation, but it’s actually pretty important—especially if you’re interested in staying healthy and active.</p>
           <h2>What Is Visceral Fat?</h2>
           <p>Visceral fat is the fat that lives deep inside your belly, wrapped around your organs like your liver, pancreas, and intestines. Unlike the fat you can pinch just under your skin (called <strong>subcutaneous fat</strong>), visceral fat is hidden away inside. While a little fat is normal and necessary, too much visceral fat can affect your health in ways you might not expect, quietly increasing your risk of several serious health conditions.</p>
           <p>Why? Because visceral fat isn’t just sitting there quietly. It’s active tissue that releases chemicals and hormones that can increase inflammation and interfere with how your body functions. This can raise your risk for serious health issues like <strong>heart disease</strong>, <strong>type 2 diabetes</strong>, and other metabolic problems.</p>`,
          `<h2>Why Motion Matters</h2>
           <p>Here’s the good news: visceral fat responds well to movement. That’s where walking and staying active come in. At <strong>MotionC</strong>, we believe <strong>Motion Creates Change</strong>—and that includes changes inside your body that you might not see right away but will definitely feel over time.</p>
           <p>Walking is one of the simplest and most effective ways to start reducing <strong>visceral fat</strong>. It helps your body burn calories, improves circulation, and boosts your metabolism. Plus, it’s easy to fit into your day, no matter your fitness level.</p>
           <p>When you commit to moving regularly, you start to <strong>See Positive Change</strong>—whether it’s more energy, better sleep, or just feeling stronger and more confident in your own skin. Motion doesn’t just change how you look — it changes how you live.</p>`,
          `<h2>Diet and Visceral Fat: What to Eat</h2>
           <p>Eating the right foods can support your efforts to reduce visceral fat. Focus on nutrient-dense options like <strong>fruits and vegetables</strong> (rich in fiber and antioxidants), <strong>whole grains</strong> (such as oats, brown rice, and quinoa), <strong>lean proteins</strong> (such as chicken, fish, beans, and legumes), <strong>healthy fats</strong> (found in avocados, nuts, seeds, and olive oil), and <strong>foods rich in omega-3 fatty acids</strong> (like salmon, flaxseeds, and walnuts).</p>
           <p>You might wonder what exactly “unhealthy fats” are, since fats aren’t all bad. Unhealthy fats typically refer to <strong>trans fats</strong> and excessive <strong>saturated fats</strong>. Trans fats are artificially created fats found in many processed and fried foods, and they can raise bad cholesterol levels while lowering good cholesterol. Saturated fats, found in some fatty meats and full-fat dairy, can also contribute to <strong>heart disease</strong> if consumed in excess. Limiting these fats helps reduce inflammation and supports healthier fat distribution in the body.</p>`,
          `<h2>Diet and Visceral Fat: What to Limit</h2>
           <p>On the other hand, limiting foods that are high in sugar, refined carbs, unhealthy fats, and excessive alcohol can make a big difference. Avoid or reduce intake of:</p>
           <ul>
             <li><strong>Sugary drinks and snacks</strong> (soda, candy, and pastries)</li>
             <li><strong>Refined carbs</strong> (white bread, white rice, and many processed foods)</li>
             <li><strong>Fried and fast foods</strong> (high in unhealthy fats and calories)</li>
             <li><strong>Excessive alcohol</strong> (which can contribute to fat accumulation)</li>
             <li><strong>High-sodium processed foods</strong> (which can cause water retention and other issues)</li>
           </ul>`,
          `<h2>How Can You Measure Visceral Fat?</h2>
           <p>Since <strong>visceral fat</strong> is hidden deep inside your abdomen around your organs, it’s not something you can see or easily pinch. But there are a few practical ways to get an idea of whether you might have too much of it:</p>
           <h3>1. Waist Measurement</h3>
           <p>One of the simplest and most practical methods is measuring your waist circumference. Using a tape measure, wrap it around your bare stomach, just above your hip bones (usually at the level of your belly button). Make sure the tape is snug but not squeezing your skin.</p>
           <ul>
             <li>For men, a waist measurement over about 40 inches (102 cm) can indicate excess visceral fat.</li>
             <li>For women, a waist measurement over about 35 inches (88 cm) can be a warning sign.</li>
           </ul>
           <p>While this doesn’t measure visceral fat directly, it’s a good indicator because visceral fat tends to increase belly size.</p>`,
          `<h2>Other Ways to Estimate Visceral Fat</h2>
           <h3>2. Waist-to-Hip Ratio</h3>
           <p>This method compares the size of your waist to your hips. Measure your hips at the widest part, then divide your waist measurement by your hip measurement. Higher ratios suggest more visceral fat.</p>
           <ul>
             <li>A ratio above 0.90 for men and 0.85 for women may indicate higher <strong>visceral fat</strong> levels.</li>
           </ul>
           <h3>3. Body Composition Scales and Devices</h3>
           <p>Some advanced bathroom scales and handheld devices use bioelectrical impedance to estimate body fat percentage, including visceral fat. While convenient, these can vary in accuracy and are best used as a general guide rather than a precise measurement.</p>`,
          `<h2>4. Medical Imaging (Most Accurate)</h2>

        pages: [
          `<h2>Your Friendly Guide to Feeling Great with MotionC</h2>
           <p>At <strong>MotionC</strong>, we know that getting healthy isn’t about turning your life upside down overnight or following a strict, joyless regimen. Instead, it’s about small, meaningful steps that add up to big changes. We call it the power of motion — because <strong>Motion Creates Change</strong>.</p>
           <p>To help you on your journey, here are the 8 core principles we focus on, explained in a friendly, no-pressure way.</p>`,
          `<h2>1. Sleep Quality: Your Body’s Nightly Recharge Station</h2>
           <p>Think of sleep as your body’s ultimate reset button. It’s where recovery happens, hormones get balanced, your appetite gets regulated, and your brain sharpens up for decision-making. Skimp on sleep, and everything else starts to wobble. So, treat yourself to good sleep—it’s the foundation of feeling energized and ready to take on the day.</p>
           <h2>2. Hydration: More Than Just Quenching Thirst</h2>
           <p>Water is your body’s best friend. It keeps your blood flowing smoothly, helps regulate your temperature (no overheating here!), boosts physical performance, and even plays a sneaky role in how hungry you feel. So, keep that water bottle handy and sip your way to better health.</p>`,
          `<h2>3. Nutrition: Fueling Your Body’s Engine</h2>
           <p>Food isn’t just about filling your stomach; it’s about giving your body the right fuel and nutrients to repair itself and function like a well-oiled machine. Think colorful veggies, wholesome grains, and proteins that make you feel good inside and out. Your body will thank you with more energy and better mood.</p>
           <h2>4. Walking: The Simple Superstar</h2>
           <p>Walking is like that reliable friend who’s always there for you. It’s one of the easiest ways to boost your heart health, rev up your metabolism, lift your mood, and keep your joints moving smoothly. Plus, it’s free, fun, and you can do it almost anywhere. So, lace up and enjoy the stroll!</p>`,
          `<h2>5. Stress Management: Keeping Calm in the Chaos</h2>
           <p>Life throws curveballs, and chronic stress can sneakily mess with your sleep, eating habits, blood pressure, and motivation. Finding ways to manage stress—whether it’s through breathing exercises, hobbies, or just taking a moment to pause—can make a huge difference in how you feel day to day.</p>
           <h2>6. Alcohol: Enjoy in Moderation</h2>
           <p>We’re not here to preach, but it’s good to know that alcohol can impact your recovery, sleep quality, calorie intake, and long-term health. Enjoying a drink now and then is part of life, but being mindful helps you keep feeling your best.</p>`,
          `<h2>7. Current Smoking Status: Recognizing Progress</h2>
           <p>Quitting smoking is one of the biggest wins for your health, and we celebrate every step toward that goal. At <strong>MotionC</strong>, we recognize where you are right now and applaud the healthy choices you’re making. Every positive change counts, and quitting smoking is a game-changer.</p>
           <h2>8. Activity Level: Keep Moving, Keep Thriving</h2>

        completeSpreads * 2 + (remainingArticles === 0 ? 0 : remainingArticles === 1 ? 1 : 2)
      );
      const leftListingPage = resultSpread * 2 + 1;
      const rightListingPage = leftListingPage + 1;
      const leftHeading = resultSpread === 0
        ? `<h2 class="book-title">${escapeHtml(currentResultTitle)}</h2>`
        : `<h2 class="book-page-label">Page ${leftListingPage} of ${totalListingPages}</h2>`;
      const leftSubtitle = resultSpread === 0
        ? `${currentResults.length} ${currentResults.length === 1 ? "article" : "articles"} found`
        : "";

      leftBookPage.innerHTML = `
        ${leftHeading}
        <p class="book-subtitle">${leftSubtitle}</p>
        ${
          leftArticles.length
            ? `<ul class="book-list">${leftArticles.map(articleButton).join("")}</ul>`
            : `<p class="empty-result">No matching articles were found.<br>Try another word or subject.</p>`
        }
      `;

      rightBookPage.innerHTML = `
        <h2 class="book-page-label">
          ${rightArticles.length ? `Page ${rightListingPage} of ${totalListingPages}` : ""}
        </h2>
        <p class="book-subtitle"></p>
        ${
          rightArticles.length
            ? `<ul class="book-list">${rightArticles.map(articleButton).join("")}</ul>`
            : ``
        }
      `;

      bookIndex.hidden = false;
      bookPrevious.hidden = resultSpread === 0;
      bookNext.hidden = resultSpread >= totalSpreads - 1;
    }

    function showCategory(categoryId) {
      const category = categoryMap.get(categoryId);
      if (!category) return;

      openSection(categoryId, {
        title: category.title,
        description: category.description,
        results: articles.filter(article => article.category === categoryId)
      });
    }

    function searchArticles(query) {
      const words = query
        .toLowerCase()
        .trim()
        .split(/\s+/)
        .filter(Boolean);

      if (!words.length) return;

      const results = articles.filter(article => {
        const category = categoryMap.get(article.category);
        const searchable = [
          article.title,
          article.summary,
          article.tags.join(" "),
          category?.title || "",
          article.pages.join(" ")
        ].join(" ").toLowerCase();

        return words.every(word => searchable.includes(word));
      });

      openSection("search", {
        title: `Search: “${query.trim()}”`,
        description: "Results from every Library section.",
        results
      });
    }

    function sectionArticleButton(article) {
      const category = categoryMap.get(article.category);
      return `<li>
        <button class="section-article" type="button" data-article="${article.id}">
          <strong>${escapeHtml(article.title)}</strong>
          <small>${escapeHtml(article.summary)}${activeSectionId === "search" ? ` · ${escapeHtml(category?.title || "")}` : ""}</small>
          <i aria-hidden="true">→</i>
        </button>
      </li>`;
    }

    function renderSection(scrollTop = 0) {
      sectionHeading.textContent = activeSectionId === "search"
        ? currentResultTitle
        : categoryMap.get(activeSectionId)?.title || "Library";
      sectionDescription.textContent = activeSectionId === "search"
        ? "Results from every Library section."
        : categoryMap.get(activeSectionId)?.description || "";
      sectionContent.innerHTML = sectionResultArticles.length
        ? `<ul class="section-article-list">${sectionResultArticles.map(sectionArticleButton).join("")}</ul>`
        : '<p class="section-empty">No matching articles were found. Try another word or subject.</p>';
      sectionCount.textContent = `${sectionResultArticles.length} ${sectionResultArticles.length === 1 ? "article" : "articles"}`;
      const categoryIndex = categories.findIndex(category => category.id === activeSectionId);
      sectionPrevious.disabled = categoryIndex < 0;
      sectionNext.disabled = categoryIndex < 0;
      requestAnimationFrame(() => { sectionContent.scrollTop = scrollTop; });
    }

    function openSection(sectionId, options = {}) {
      if (activeSectionId) sectionScrollPositions.set(activeSectionId, sectionContent.scrollTop);
      const changingSection = activeSectionId !== sectionId;
      activeSectionId = sectionId;
      currentResultTitle = options.title || categoryMap.get(sectionId)?.title || "Library";
      sectionResultArticles = options.results || articles.filter(article => article.category === sectionId);
      renderSection(changingSection ? 0 : sectionScrollPositions.get(sectionId) || 0);
      sectionOverlay.hidden = false;
      requestAnimationFrame(() => {
        sectionOverlay.classList.add("open");
        sectionIndex.focus();
      });
    }

    function closeSectionToIndex() {
      if (activeSectionId) sectionScrollPositions.set(activeSectionId, sectionContent.scrollTop);
      sectionOverlay.classList.remove("open");
      window.setTimeout(() => {
        sectionOverlay.hidden = true;
        activeSectionId = null;
        renderIndex();
      }, 440);
    }

    function moveSection(direction) {
      const currentIndex = categories.findIndex(category => category.id === activeSectionId);
      if (currentIndex < 0) return;
      const nextIndex = (currentIndex + direction + categories.length) % categories.length;
      const next = categories[nextIndex];
      openSection(next.id, {
        title: next.title,
        description: next.description,
        results: articles.filter(article => article.category === next.id)
      });
    }

    function renderReaderPage() {
      if (!activeArticle) return;
      readerHeading.textContent = activeArticle.title;
      readerCategory.textContent = categoryMap.get(activeArticle.category)?.title || "MotionC Library";
      readerContent.innerHTML = activeArticle.pages[activeArticlePage];
      readerContent.scrollTop = 0;
      const isLastPage = activeArticlePage >= activeArticle.pages.length - 1;
      readerPageNumber.textContent = isLastPage
        ? `Page ${activeArticlePage + 1} of ${activeArticle.pages.length} • End of article`
        : `Page ${activeArticlePage + 1} of ${activeArticle.pages.length} • More to read`;
      readerPageNumber.classList.toggle("more-pages", !isLastPage);
      readerPrevious.disabled = activeArticlePage === 0;
      readerNext.disabled = isLastPage;
      readerNext.textContent = isLastPage ? "Finished" : "Next Page →";
    }

    function openArticle(articleId) {
      activeArticle = articles.find(article => article.id === articleId);
      if (!activeArticle) return;

      if (activeSectionId) sectionScrollPositions.set(activeSectionId, sectionContent.scrollTop);
      activeArticlePage = 0;
      renderReaderPage();
      readerOverlay.hidden = false;
      requestAnimationFrame(() => {
        readerOverlay.classList.add("open");
        readerIndex.focus();
      });
    }

    function closeReaderToSection() {
      readerOverlay.classList.remove("open");
      window.setTimeout(() => {
        readerOverlay.hidden = true;
        activeArticle = null;
        const savedPosition = sectionScrollPositions.get(activeSectionId) || 0;
        requestAnimationFrame(() => {
          sectionContent.scrollTop = savedPosition;
          sectionIndex.focus();
        });
      }, 540);
    }

    document.addEventListener("click", event => {
      const categoryButton = event.target.closest("[data-category]");
      if (categoryButton) {
        showCategory(categoryButton.dataset.category);
        return;
      }

      const articleButton = event.target.closest("[data-article]");
      if (articleButton) {
        openArticle(articleButton.dataset.article);
      }
    });

    bookIndex.addEventListener("click", () => turnBook(renderIndex));

    bookPrevious.addEventListener("click", () => {
      if (resultSpread <= 0) return;
      resultSpread -= 1;
      turnBook(renderResults);
    });

    bookNext.addEventListener("click", () => {
      const totalSpreads = Math.ceil(currentResults.length / 6);
      if (resultSpread >= totalSpreads - 1) return;
      resultSpread += 1;
      turnBook(renderResults);
    });

    magnifierHotspot.addEventListener("click", () => {
      const open = !searchPanel.classList.contains("open");
      searchPanel.classList.toggle("open", open);
      magnifierHotspot.setAttribute("aria-expanded", String(open));
      if (open) librarySearch.focus();
    });

    searchPanel.addEventListener("submit", event => {
      event.preventDefault();
      searchArticles(librarySearch.value);
      searchPanel.classList.remove("open");
      magnifierHotspot.setAttribute("aria-expanded", "false");
    });

    sectionIndex.addEventListener("click", closeSectionToIndex);
    sectionPrevious.addEventListener("click", () => moveSection(-1));
    sectionNext.addEventListener("click", () => moveSection(1));
    readerIndex.addEventListener("click", closeReaderToSection);

    readerPrevious.addEventListener("click", () => {
      if (activeArticlePage <= 0) return;
      activeArticlePage -= 1;
      renderReaderPage();
    });

    readerNext.addEventListener("click", () => {
      if (!activeArticle || activeArticlePage >= activeArticle.pages.length - 1) return;
      activeArticlePage += 1;
      renderReaderPage();
    });

    document.addEventListener("keydown", event => {
      if (event.key !== "Escape") return;

      if (!readerOverlay.hidden) {
        closeReaderToSection();
        return;
      }

      if (!sectionOverlay.hidden) {
        closeSectionToIndex();
        return;
      }

      if (searchPanel.classList.contains("open")) {
        searchPanel.classList.remove("open");
        magnifierHotspot.setAttribute("aria-expanded", "false");
        magnifierHotspot.focus();
      }
    });

    const preferencesStorageKey = "motionc-preferences-v1";
    const preferencesToggle = document.getElementById("preferencesToggle");
    const preferencesMenu = document.getElementById("preferencesMenu");
    const preferencesClose = document.getElementById("preferencesClose");

    function loadLibraryUnitSystem() {
      try {
        return JSON.parse(localStorage.getItem(preferencesStorageKey))?.unitSystem === "metric"
          ? "metric"
          : "imperial";
      } catch {
        return "imperial";
      }
    }

    function syncLibraryUnitChoices() {
      const selected = loadLibraryUnitSystem();
      document.querySelectorAll('input[name="unitSystem"]').forEach(input => {
        input.checked = input.value === selected;
      });
    }

    function closeLibraryPreferences() {
      preferencesMenu.hidden = true;
      preferencesToggle.setAttribute("aria-expanded", "false");
    }

    preferencesToggle.addEventListener("click", event => {
      event.preventDefault();
      event.stopPropagation();
      const willOpen = preferencesMenu.hidden;
      if (willOpen) syncLibraryUnitChoices();
      preferencesMenu.hidden = !willOpen;
      preferencesToggle.setAttribute("aria-expanded", String(willOpen));
    });

    preferencesMenu.addEventListener("click", event => event.stopPropagation());
    preferencesClose.addEventListener("click", closeLibraryPreferences);
    document.addEventListener("click", closeLibraryPreferences);

    document.querySelectorAll('input[name="unitSystem"]').forEach(input => {
      input.addEventListener("change", () => {
        const unitSystem = input.value === "metric" ? "metric" : "imperial";
        localStorage.setItem(
          preferencesStorageKey,
          JSON.stringify({ unitSystem, updatedAt: new Date().toISOString() })
        );
        window.dispatchEvent(new CustomEvent("motionc:preferences-updated", { detail: { unitSystem } }));
      });
    });

    window.addEventListener("storage", event => {
      if (event.key === preferencesStorageKey) syncLibraryUnitChoices();
    });

    const mobileMoreToggle = document.getElementById("mobileMoreToggle");
    const mobileMoreMenu = document.getElementById("mobileMoreMenu");

    function setMobileMoreMenu(open) {
      mobileMoreMenu.hidden = !open;
      mobileMoreToggle.setAttribute("aria-expanded", String(open));
      mobileMoreToggle.setAttribute(
        "aria-label",
        open ? "Close more navigation" : "Open more navigation"
      );
    }

    mobileMoreToggle.addEventListener("click", () => {
      setMobileMoreMenu(mobileMoreMenu.hidden);
    });

    document.addEventListener("click", event => {
      if (
        mobileMoreMenu.hidden ||
        mobileMoreMenu.contains(event.target) ||
        mobileMoreToggle.contains(event.target)
      ) return;
      setMobileMoreMenu(false);
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && !mobileMoreMenu.hidden) {
        setMobileMoreMenu(false);
        mobileMoreToggle.focus();
      }
      if (event.key === "Escape" && !preferencesMenu.hidden) {
        closeLibraryPreferences();
        preferencesToggle.focus();
      }
    });

    window.addEventListener("resize", () => {
      if (window.innerWidth > 700 && !mobileMoreMenu.hidden) setMobileMoreMenu(false);
    });

    syncLibraryUnitChoices();
    async function loadPublishedArticles() {
      const { data, error } = await supabase
        .from("library_articles")
        .select("slug, category, title, summary, tags, pages, display_order")
        .order("display_order", { ascending: true })
        .order("title", { ascending: true });

      if (error) throw error;
      if (!Array.isArray(data) || !data.length) return;

      articles = data.map(article => ({
        id: article.slug,
        category: article.category,
        title: article.title,
        summary: article.summary || "",
        tags: Array.isArray(article.tags) ? article.tags : [],
        pages: Array.isArray(article.pages) ? article.pages : []
      }));
    }

    try {
      await loadPublishedArticles();
    } catch (error) {
      console.error("MotionC Library could not load Supabase articles; using the embedded fallback.", error);
    }

    renderIndex();
  </script>
</body>
</html>
