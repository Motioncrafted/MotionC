<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drop Zone | MotionC</title>
  <meta name="description" content="Leave your mark and celebrate progress in the MotionC Drop Zone.">
  <link rel="stylesheet" href="/drop-zone/styles.css">
</head>
<body class="nav-visualization">
  <main class="prototype-shell">
    <section class="wall-stage" aria-label="MotionC Drop Zone">
      <img class="wall-art" src="../images/drop-zone.png" alt="">

      <button class="motionc-brand" id="preferencesToggle" type="button"
        aria-label="Open preferences" aria-expanded="false" aria-controls="preferencesMenu">
        <img src="/images/nav/motionc-logo.png" alt="">
      </button>

      <nav class="top-navigation" aria-label="MotionC navigation">
        <a class="nav-home" href="/landing-page/"><img src="/images/nav/home.png" alt=""><small>Home</small></a>
        <a class="nav-daily" href="/daily/"><img src="/images/nav/daily.png" alt=""><small>Daily</small></a>
        <a class="nav-mcp" href="/dashboard/"><img src="/images/nav/mcp.png" alt=""><small>MCP</small></a>
        <a class="nav-library" href="/library/"><img src="/images/nav/library.png" alt=""><small>Library</small></a>
        <a class="nav-walking" href="/walking/"><img src="/images/nav/walking.png" alt=""><small>Walking</small></a>
        <a class="nav-drop-zone active" href="/drop-zone/" aria-current="page"><img src="/images/nav/drop-zone.png" alt=""><small>Drop Zone</small></a>
        <button class="mobile-more-toggle section-active" id="mobileMoreToggle" type="button"
          aria-label="Open more navigation" aria-expanded="false" aria-controls="mobileMoreMenu">
          <span class="more-glyph" aria-hidden="true">•••</span>
          <small>More</small>
        </button>
      </nav>

      <div class="mobile-more-menu" id="mobileMoreMenu" hidden>
        <a href="/walking/"><img src="/images/nav/walking.png" alt=""><span>Walking</span></a>
        <a class="active" href="/drop-zone/" aria-current="page"><img src="/images/nav/drop-zone.png" alt=""><span>Drop Zone</span></a>
      </div>

      <div class="preferences-menu" id="preferencesMenu" hidden>
        <button class="preferences-close" id="preferencesClose" type="button" aria-label="Close preferences">×</button>
        <strong>Preferences</strong>
        <p>Measurement system</p>
        <label><input type="radio" name="unitSystem" value="imperial"> Imperial <small>lb · mi · in</small></label>
        <label><input type="radio" name="unitSystem" value="metric"> Metric <small>kg · km · cm</small></label>
      </div>

      <div class="permanent-tag mira-tag">MIRA was here 💖</div>
      <div class="permanent-tag steps-tag">small steps still move you →</div>

      <div class="tag-layer" id="tagLayer" aria-live="polite"></div>

      <aside class="common-history" id="commonHistory" aria-label="The Commons tag history">
        <p class="history-state" id="historyState">Loading the latest wins…</p>
      </aside>

      <div class="mist-target" id="mistTarget" aria-hidden="true"></div>
      <div class="spray-stream" id="sprayStream" aria-hidden="true"></div>
      <div class="purple-can-pulse" id="purpleCan" aria-hidden="true"></div>

      <div class="interactive-controls">
        <label class="message-field">
          <span class="sr-only">Share your win</span>
          <textarea id="message" maxlength="60" placeholder="Share your win...">Small steps count!</textarea>
          <small><span id="messageCount">18</span>/60</small>
        </label>

        <div class="emoji-picker">
          <button
            aria-expanded="false"
            aria-label="Choose an emoji"
            class="emoji-toggle"
            id="emojiToggle"
            type="button"
          >😊</button>
          <div class="emoji-menu" id="emojiMenu" role="menu" hidden>
            <button data-emoji="🎉" role="menuitem" type="button">🎉</button>
            <button data-emoji="🔥" role="menuitem" type="button">🔥</button>
            <button aria-label="Members emoji locked" class="locked" disabled type="button">💪</button>
            <button aria-label="Members emoji locked" class="locked" disabled type="button">👟</button>
          </div>
        </div>

        <div class="font-picks" aria-label="Choose a font">
          <button class="selected" data-font="'Segoe Print', 'Comic Sans MS', cursive" type="button">BRUSH</button>
          <button data-font="'Comic Sans MS', cursive" type="button">WILD</button>
          <button
            aria-label="Marker font — registration required"
            class="locked-choice"
            disabled
            title="Register to unlock Marker"
            type="button"
          >MARKER</button>
          <button
            aria-label="Chalk font — registration required"
            class="locked-choice"
            disabled
            title="Register to unlock Chalk"
            type="button"
          >CHALK</button>
        </div>

        <div class="color-picks" aria-label="Choose a colour">
          <button aria-label="Use pink paint" class="selected" data-color="#d52b69" style="background:#d52b69" type="button"></button>
          <button aria-label="Use orange paint" data-color="#ee7512" style="background:#ee7512" type="button"></button>
          <button aria-label="Use yellow paint" data-color="#ffbf22" style="background:#ffbf22" type="button"></button>
          <button aria-label="Green paint — registration required" class="locked-choice" disabled style="background:#69a923" title="Register to unlock green" type="button"></button>
          <button aria-label="Teal paint — registration required" class="locked-choice" disabled style="background:#0ea5b3" title="Register to unlock teal" type="button"></button>
          <button aria-label="Purple paint — registration required" class="locked-choice" disabled style="background:#7550a5" title="Register to unlock purple" type="button"></button>
        </div>

        <button class="spray-button" id="sprayButton" type="button">SPRAY IT!</button>
      </div>
    </section>
  </main>
  <script src="/drop-zone/script.js"></script>
</body>
</html>
